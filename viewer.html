<!doctype html>
<html lang="en" data-app-stylr-theme="dark" data-app-stylr-accent="mint" data-app-stylr-tone="normal" data-app-stylr-density="comfortable">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spottr screenshot</title>
    <link rel="stylesheet" href="viewer.css">
    <link rel="icon" href="icons/chrome/icon-32.png?v=graphite-1" type="image/png" sizes="32x32">
  </head>
  <body>
    <main>
      <header class="viewer-header">
        <div>
          <a class="viewer-brand" href="welcome.html">Spottr</a>
          <h1 id="project">QA note</h1>
          <p id="meta" class="viewer-meta"></p>
        </div>
        <a id="source" class="source-link" hidden target="_blank" rel="noreferrer">Open source page</a>
      </header>

      <p id="status" class="status" role="status" aria-live="polite">Loading screenshot...</p>

      <section id="viewer" class="viewer" hidden>
        <figure class="screenshot-frame">
          <img id="screenshot" alt="QA note screenshot">
        </figure>
        <p id="message" class="note-message"></p>
      </section>
    </main>
    <script type="module" src="viewer.js"></script>
  </body>
</html>
